name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Turbo 2D Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Android platform..."
            npx cap add android
          fi
          echo "Syncing web assets and native plugins..."
          npx cap sync android

      - name: Set Permissions for Gradle Wrapper
        run: |
          chmod +x ./android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

      - name: Stage APK for Artifact Upload
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} build-artifacts/Turbo-2D-Racing-debug.apk \;
          echo "Built APK size:"
          ls -lh build-artifacts/

      - name: Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-2D-Racing-v1.0-debug-apk
          path: build-artifacts/Turbo-2D-Racing-debug.apk
          retention-days: 30
